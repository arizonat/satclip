# lightning.pytorch==2.0.0
seed_everything: 0
trainer:
  logger:
    - class_path: lightning.pytorch.loggers.TensorBoardLogger
      init_args:
        save_dir: 'satclip_temporal_logs'
        name: 'satclip-s2-satcliploss-1M'
        version: 'satclip-s2-satcliploss-1M'
    - class_path: lightning.pytorch.loggers.WandbLogger
      init_args:
        save_dir: 'satclip_temporal_logs'
        project: 'satclip-s2-satcliploss-1M'
        name: 'satclip-s2-satcliploss-1M'
        version: 'satclip-s2-satcliploss-1M'
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: "val_loss"
        save_last: True
        filename: "{epoch}-{val_loss:.2f}"
  max_epochs: 500
model:
  is_temporal: True
  loss_type: 'satclip_loss'
  te_type: 'fourier'
  te_k: 10
  embed_dim: 256
  image_resolution: 224
  vision_layers: "moco_vit16"
  vision_width: 128
  vision_patch_size: 32
  in_channels: 13
  le_type: 'sphericalharmonics'
  frequency_num: 16
  max_radius: 0.01
  min_radius: 0.00001
  legendre_polys: 32
  sh_embedding_dims: 32
  learning_rate: 0.0001
  num_hidden_layers: 2
  capacity: 256
data:
  data_dir: /mnt/DATA/leca5365/satclip-s2-1M-2.0
  batch_size: 4096
  num_workers: 8
  val_random_split_fraction: 0.1
  crop_size: 224
watchmodel: True
